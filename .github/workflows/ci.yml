name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run deterministic recommendation audit
        run: npm run qa:recommend-deterministic

      - name: Run local recommendation audit
        run: npm run qa:recommend-local

      - name: Upload recommendation audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-audit-artifacts
          path: |
            artifacts/deterministic-recommend-audit.json
            artifacts/local-recommend-audit.json
